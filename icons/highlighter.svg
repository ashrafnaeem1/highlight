<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 96" width="146" height="96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- highlight stroke -->
  <rect x="62.70" y="83" width="19.13" height="7" rx="3.5" fill="#4caf50"/>
  <rect x="62.70" y="87" width="19.13" height="3" rx="1.5" fill="#429846"/>
  <!-- pen: the tip's lowest corner rests on the stroke near its left end; tip and body share one axis -->
  <g transform="translate(84.80 80.96) rotate(-45)">
    <!-- neck (drawn first so the tip sits on top of its back end) -->
    <rect x="2.8" y="-12.4416" width="18.14" height="24.8832" fill="#cdd0d2"/>
    <!-- dark green tip with a thin border -->
    <path d="M-9.2 -3 L2.8 -3 L4.8 3 L-7.2 3 Z" fill="#2e7d32" stroke="#1b5e20" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- body: frustum of a cone -->
    <path d="M22 -11.88 L61.73 -6.69 A 2.20 6.69 0 0 1 61.73 6.69 L22 11.88 Z" fill="#607d8b"/>
    <!-- cap band -->
    <path d="M55.68 -7.48 L61.73 -6.69 A 2.20 6.69 0 0 1 61.73 6.69 L55.68 7.48 Z" fill="#546d79"/>
  </g>
</svg>
