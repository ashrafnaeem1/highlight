<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="seg" id="theme" role="group" aria-label="Theme">
      <button data-theme-choice="system">System</button>
      <button data-theme-choice="light">Light</button>
      <button data-theme-choice="dark">Dark</button>
    </div>

    <div id="main">
      <div class="scope" id="scope">
        <button
          class="scope-btn"
          id="scopeBtn"
          data-tip="Choose which highlights to show"
        >
          <span id="scopeLabel"></span
          ><span
            class="ico"
            style="--icon: url('icons/chevron-down.svg')"
          ></span>
        </button>
        <ul class="scope-list" id="scopeList" hidden></ul>
      </div>
      <input
        type="search"
        id="search"
        placeholder="Search Highlights"
        autocomplete="off"
      />
      <ul id="list"></ul>
      <p id="status"></p>
    </div>

    <div class="picker" id="picker" hidden>
      <div class="picker-head">
        <span class="edit-title">Edit Color</span>
        <span class="previews">
          <span
            class="preview"
            id="prevSwatch"
            data-tip="Previous"
          ></span>
          <span
            class="preview"
            id="newSwatch"
            data-tip="New"
          ></span>
        </span>
        <span class="btns-head">
          <button
            class="btn"
            id="pickerReset"
            data-tip="Reset This Color to Default"
          >
            Reset
          </button>
          <button
            class="btn"
            id="pickerDone"
            data-tip="Done - Change Color"
          >
            Done
          </button>
        </span>
      </div>
      <div
        class="seg"
        id="target"
        role="group"
        aria-label="Apply To"
      >
        <button data-target="bg" class="active">
          Background
        </button>
        <button data-target="fg">Text</button>
      </div>
      <div class="picker-body">
        <canvas id="wheel" width="140" height="140"></canvas>
        <div class="sliders">
          <label
            >Bright
            <input type="range" id="bright" min="0" max="100"
          /></label>
          <label
            >R
            <input
              type="range"
              id="r"
              min="0"
              max="255" /><input
              type="number"
              id="rn"
              min="0"
              max="255"
          /></label>
          <label
            >G
            <input
              type="range"
              id="g"
              min="0"
              max="255" /><input
              type="number"
              id="gn"
              min="0"
              max="255"
          /></label>
          <label
            >B
            <input
              type="range"
              id="b"
              min="0"
              max="255" /><input
              type="number"
              id="bn"
              min="0"
              max="255"
          /></label>
          <label
            >Hex <input type="text" id="hex" maxlength="7"
          /></label>
          <button class="btn" id="autoText">Auto Text</button>
        </div>
      </div>
    </div>

    <div class="advanced">
      <button class="adv-toggle" id="advToggle">
        <span
          class="ico"
          style="--icon: url('icons/chevron-right.svg')"
        ></span
        ><span>Advanced</span>
      </button>
      <div class="adv-panel" id="advPanel" hidden>
        <button
          class="btn danger"
          id="resetBtn"
          data-tip="Permanently deletes all highlights, notes, and settings on every site.&#10;Use it to start fresh, fix legacy problems, or before removing the extension."
        >
          RESET EVERYTHING
        </button>
      </div>
    </div>

    <div class="modal" id="resetModal" hidden>
      <div class="modal-box">
        <p>Would you like to export your highlights first?</p>
        <div class="modal-btns">
          <button class="btn ok" id="mExport">
            Export, Then Reset
          </button>
          <button class="btn danger" id="mReset">
            Reset Without Export
          </button>
          <button class="btn" id="mCancel">Cancel</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="palette" id="palette"></div>
      <div class="btns">
        <button class="btn" id="exportBtn">
          <span
            class="ico"
            style="--icon: url('icons/arrow-up-tray.svg')"
          ></span
          ><span>Export</span>
        </button>
        <button class="btn" id="importBtn">
          <span
            class="ico"
            style="--icon: url('icons/arrow-down-tray.svg')"
          ></span
          ><span>Import</span>
        </button>
        <input
          type="file"
          id="importFile"
          accept="application/json,.json"
          hidden
        />
      </div>
    </div>
    <div class="ptip" id="ptip" hidden></div>
    <div class="ctip" id="ctip"></div>
    <p id="notice"></p>
    <script src="popup.js"></script>
  </body>
</html>
