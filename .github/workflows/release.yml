name: Release

# Two ways to publish:
#  1. Push a tag such as v0.0.7 (the tag must match the manifest version).
#  2. Run "Release" manually from the Actions tab. It publishes the version in
#     highlight/manifest.json, which is how the first release is made without
#     creating a tag by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Work out the version and tag
        run: |
          MANIFEST_VERSION="$(jq -r .version highlight/manifest.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag $TAG does not match manifest version $MANIFEST_VERSION. Update highlight/manifest.json first."
              exit 1
            fi
          else
            TAG="v$MANIFEST_VERSION"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Stop if the release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in highlight/manifest.json to publish again."
            exit 1
          fi

      - name: Check the scripts are valid JavaScript
        run: |
          node --check highlight/content.js
          node --check highlight/popup.js

      - name: Package the extension
        run: |
          zip -r "highlight-${VERSION}.zip" highlight -x "*.DS_Store"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "highlight-${VERSION}.zip" \
            --title "Highlight ${VERSION}" \
            --generate-notes \
            --notes-file - <<'NOTES'
          Install: download the zip, unzip it, open chrome://extensions (or edge://extensions),
          turn on Developer mode, and choose Load unpacked on the highlight folder.
          Full instructions are in the README.
          NOTES
