name: Release

# Two ways to publish:
#  1. Push a tag such as v0.1.1 (the tag must match the manifest version).
#  2. Run "Release" manually from the Actions tab. It publishes the version in
#     the extension's manifest.json.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Folder that holds manifest.json. "." means the repository root.
  EXT_DIR: '.'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Check the extension folder
        run: |
          if [ ! -f "$EXT_DIR/manifest.json" ]; then
            echo "::error::No manifest.json in '$EXT_DIR'. Set EXT_DIR in release.yml to the folder that contains it."
            exit 1
          fi

      - name: Work out the version and tag
        run: |
          MANIFEST_VERSION="$(jq -r .version "$EXT_DIR/manifest.json")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag $TAG does not match manifest version $MANIFEST_VERSION. Update manifest.json first."
              exit 1
            fi
          else
            TAG="v$MANIFEST_VERSION"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Check the versions agree
        run: |
          # Accepts single or double quotes, since the repository uses single quotes
          STAMP_CONTENT="$(sed -nE "s/.*DATA_VERSION = ['\"]([^'\"]+)['\"].*/\1/p" "$EXT_DIR/content.js" | head -1)"
          STAMP_POPUP="$(sed -nE "s/.*dataVersion: ['\"]([^'\"]+)['\"].*/\1/p" "$EXT_DIR/popup.js" | head -1)"
          echo "manifest=$VERSION content=$STAMP_CONTENT popup=$STAMP_POPUP"
          if [ "$STAMP_CONTENT" != "$VERSION" ] || [ "$STAMP_POPUP" != "$VERSION" ]; then
            echo "::error::DATA_VERSION in content.js or dataVersion in popup.js does not match $VERSION."
            exit 1
          fi

      - name: Stop if the release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in manifest.json to publish again."
            exit 1
          fi

      - name: Check the scripts are valid JavaScript
        run: |
          node --check "$EXT_DIR/content.js"
          node --check "$EXT_DIR/popup.js"

      - name: Package the extension
        run: |
          # Zip a folder named "highlight" that holds only the extension files
          mkdir -p stage/highlight
          rsync -a --exclude '.git' --exclude '.github' --exclude '.DS_Store' "$EXT_DIR"/ stage/highlight/
          (cd stage && zip -r "../highlight-${VERSION}.zip" highlight)
          ls -la "highlight-${VERSION}.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "highlight-${VERSION}.zip" \
            --title "Ash Highlight ${VERSION}" \
            --generate-notes \
            --notes-file - <<'NOTES'
          Install: download the zip, unzip it, open chrome://extensions (or edge://extensions),
          turn on Developer mode, and choose Load unpacked on the highlight folder.
          Full instructions are in the README.
          NOTES
